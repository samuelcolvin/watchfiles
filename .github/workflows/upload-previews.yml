name: Upload Previews

# This workflow never checks out or runs code from the triggering run: it only downloads the
# built docs artifact and uploads it to smokeshow to attach a preview link to the commit.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  statuses: write

jobs:
  upload-previews:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - run: pip install click==8.0.4
      - run: pip install smokeshow

      - uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow: ci.yml
          commit: ${{ github.event.workflow_run.head_sha }}

      - run: smokeshow upload docs
        env:
          SMOKESHOW_GITHUB_STATUS_DESCRIPTION: Docs Preview
          SMOKESHOW_GITHUB_CONTEXT: docs
          SMOKESHOW_GITHUB_TOKEN: ${{ secrets.github_token }}
          SMOKESHOW_GITHUB_PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SMOKESHOW_AUTH_KEY: ${{ secrets.smokeshow_auth_key }}
